# Publica o site no GitHub Pages (mundoencantadoeduca.com.br) a cada mudança na main.
# A pasta do app (app-alfabetizando/) não vai para o site.
name: Publicar o site
on:
  push:
    branches: [main]
    paths-ignore:
      - "app-alfabetizando/**"
      - ".github/workflows/app-android.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Separar os arquivos do site
        run: |
          mkdir _site
          git ls-files | grep -vE '^(\.github/|app-alfabetizando/|LEIA-ME\.md)' | while read -r f; do
            mkdir -p "_site/$(dirname "$f")"; cp "$f" "_site/$f"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
