# Gera o app Android do Alfabetizando (APK de teste) a cada mudança na pasta do app.
name: App Android (APK de teste)

on:
  push:
    paths:
      - 'app-alfabetizando/**'
      - '.github/workflows/app-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-alfabetizando
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - run: ./gradlew assembleDebug bundleRelease --no-daemon
        working-directory: app-alfabetizando/android
      - uses: actions/upload-artifact@v4
        with:
          name: alfabetizando-teste-apk
          path: app-alfabetizando/android/app/build/outputs/apk/debug/app-debug.apk
      # Página de download para abrir direto no celular (sem login).
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk alfabetizando-teste.apk
          cp android/app/build/outputs/bundle/release/app-release.aab alfabetizando-loja-sem-assinatura.aab
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-teste
          name: Alfabetizando - versão de teste
          prerelease: true
          make_latest: false
          body: Versão de teste do app Alfabetizando. No celular Android, baixe o arquivo alfabetizando-teste.apk abaixo e abra para instalar (permita instalar apps desta fonte). A compra só funciona na versão da Play Store.
          files: |
            app-alfabetizando/alfabetizando-teste.apk
            app-alfabetizando/alfabetizando-loja-sem-assinatura.aab
